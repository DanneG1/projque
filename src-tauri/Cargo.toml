[package]
name = "projque"
version = "0.1.0"
description = "Projque - your local project shelf. A local-first, offline overview of your development projects."
authors = ["DanneG1"]
license = "MIT"
edition = "2021"

[lib]
name = "projque_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2.5"
portable-pty = "0.9"
tauri-plugin-notification = "2"
